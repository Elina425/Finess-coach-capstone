<svg width="100%" viewBox="0 0 900 900" role="img" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue', Arial, sans-serif">
  <title>xLSTM[7:1] shared-encoder multi-task architecture — EgoExo-Fitness</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L9 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <style>
    .lbl       { font-size: 13px; fill: #111; font-weight: 600; text-anchor: middle; }
    .sub       { font-size: 11px; fill: #555; text-anchor: middle; }
    .shape     { font-size: 10.5px; fill: #666; font-style: italic; }
    .out-lbl   { font-size: 13px; fill: #0e3d70; font-weight: 700; text-anchor: middle; }
    .flow      { stroke: #999; stroke-width: 1.6; fill: none; }
    .flow-soft { stroke: #1f5fa6; stroke-width: 1.4; stroke-dasharray: 4 3; fill: none; }
    .fusion-stroke { stroke: #a8266a; stroke-width: 1.8; fill: none; }
    .share-mark { stroke: #1e7c3a; stroke-width: 1.3; fill: none; }
    .title     { font-size: 15px; fill: #111; font-weight: 700; text-anchor: middle; }
  </style>

  <!-- TITLE -->
  <text x="450" y="30" class="title">xLSTM[7:1] Shared-Encoder Architecture — EgoExo-Fitness</text>

  <!-- INPUT -->
  <rect x="310" y="50" width="180" height="40" rx="6" fill="#f1efe8" stroke="#7a786e" stroke-width="1"/>
  <text x="400" y="75" class="lbl">Video Clip</text>

  <text x="502" y="108" class="shape">T frames</text>
  <line x1="400" y1="90" x2="400" y2="118" class="flow" marker-end="url(#ar)"/>

  <!-- CLIP ENCODER -->
  <rect x="310" y="118" width="180" height="40" rx="6" fill="#eeedfe" stroke="#534ab7" stroke-width="1"/>
  <text x="400" y="136" class="lbl" style="fill:#3c3489">CLIP ViT-B/32</text>
  <text x="400" y="152" class="sub" style="fill:#534ab7">pre-extracted</text>

  <text x="502" y="180" class="shape">T × 512</text>
  <line x1="400" y1="158" x2="400" y2="188" class="flow" marker-end="url(#ar)"/>

  <!-- PROJECTION -->
  <rect x="310" y="188" width="180" height="36" rx="6" fill="#faeeda" stroke="#a8742a" stroke-width="1"/>
  <text x="400" y="210" class="lbl">Linear  512 → 256</text>

  <text x="502" y="242" class="shape">T × 256</text>
  <line x1="400" y1="224" x2="400" y2="252" class="flow" marker-end="url(#ar)"/>

  <!-- SHARED ENCODER -->
  <rect x="260" y="252" width="280" height="120" rx="10" fill="#eeedfe" stroke="#534ab7" stroke-width="1.4"/>
  <text x="400" y="272" class="lbl" style="fill:#3c3489">xLSTM [ 7 : 1 ]</text>

  <rect x="278" y="288" width="26" height="60" rx="3" fill="#dcd9fb" stroke="#534ab7" stroke-width="0.8"/>
  <rect x="308" y="288" width="26" height="60" rx="3" fill="#dcd9fb" stroke="#534ab7" stroke-width="0.8"/>
  <rect x="338" y="288" width="26" height="60" rx="3" fill="#dcd9fb" stroke="#534ab7" stroke-width="0.8"/>
  <rect x="368" y="288" width="26" height="60" rx="3" fill="#dcd9fb" stroke="#534ab7" stroke-width="0.8"/>
  <rect x="398" y="288" width="26" height="60" rx="3" fill="#dcd9fb" stroke="#534ab7" stroke-width="0.8"/>
  <rect x="428" y="288" width="26" height="60" rx="3" fill="#dcd9fb" stroke="#534ab7" stroke-width="0.8"/>
  <rect x="458" y="288" width="26" height="60" rx="3" fill="#dcd9fb" stroke="#534ab7" stroke-width="0.8"/>
  <rect x="488" y="288" width="26" height="60" rx="3" fill="#fce6c4" stroke="#a8742a" stroke-width="0.8"/>

  <text x="381" y="362" class="sub" style="fill:#534ab7">7 × mLSTM</text>
  <text x="501" y="362" class="sub" style="fill:#a8742a">sLSTM</text>

  <line x1="400" y1="372" x2="400" y2="398" class="flow" marker-end="url(#ar)"/>

  <!-- ATTENTION POOL -->
  <rect x="310" y="398" width="180" height="36" rx="6" fill="#eeedfe" stroke="#534ab7" stroke-width="1"/>
  <text x="400" y="421" class="lbl" style="fill:#3c3489">Attention Pool</text>

  <text x="502" y="452" class="shape">256-d</text>
  <line x1="400" y1="434" x2="400" y2="462" class="flow" marker-end="url(#ar)"/>

  <!-- FUSION STAGE -->
  <rect x="196" y="462" width="408" height="158" rx="12" fill="#fff8fb" stroke="#a8266a" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="400" y="480" class="lbl" style="fill:#71174a; font-size:12px;">Multi-Task Fusion</text>

  <line x1="370" y1="462" x2="288" y2="494" class="fusion-stroke" marker-end="url(#ar)"/>
  <line x1="430" y1="462" x2="512" y2="494" class="fusion-stroke" marker-end="url(#ar)"/>

  <rect x="210" y="494" width="140" height="40" rx="6" fill="#fde7ee" stroke="#a8266a" stroke-width="1"/>
  <text x="280" y="512" class="lbl" style="fill:#71174a">Branch A</text>
  <text x="280" y="527" class="sub" style="fill:#a8266a">PLN → Linear</text>

  <rect x="450" y="494" width="140" height="40" rx="6" fill="#fde7ee" stroke="#a8266a" stroke-width="1"/>
  <text x="520" y="512" class="lbl" style="fill:#71174a">Branch B</text>
  <text x="520" y="527" class="sub" style="fill:#a8266a">PLN → Linear</text>

  <line x1="280" y1="534" x2="375" y2="572" class="fusion-stroke" marker-end="url(#ar)"/>
  <line x1="520" y1="534" x2="425" y2="572" class="fusion-stroke" marker-end="url(#ar)"/>

  <circle cx="400" cy="588" r="22" fill="#fff" stroke="#a8266a" stroke-width="2"/>
  <text x="400" y="598" text-anchor="middle" font-size="28" font-weight="700" fill="#a8266a">+</text>

  <text x="400" y="630" class="sub" style="fill:#71174a; font-weight:700;">fused 128-d vector</text>

  <!-- SHARED INPUT SPLIT -->
  <line x1="400" y1="640" x2="400" y2="656" class="flow"/>
  <circle cx="400" cy="658" r="4" fill="#1e7c3a"/>
  <path d="M 400 658 L 240 658 L 240 684" class="share-mark" marker-end="url(#ar)"/>
  <path d="M 400 658 L 560 658 L 560 684" class="share-mark" marker-end="url(#ar)"/>
  <rect x="328" y="664" width="144" height="18" rx="9" fill="#e6f4ea" stroke="#1e7c3a" stroke-width="0.8"/>
  <text x="400" y="677" class="sub" style="fill:#0e5527; font-weight:700;">shared input → 2 heads</text>

  <!-- TASK HEADS -->
  <rect x="158" y="684" width="162" height="48" rx="8" fill="#e6f4ea" stroke="#1e7c3a" stroke-width="1.4"/>
  <text x="239" y="704" class="lbl" style="fill:#0e5527;">Classification</text>
  <text x="239" y="720" class="sub" style="fill:#1e7c3a;">Linear → 4-class</text>

  <rect x="479" y="684" width="162" height="48" rx="8" fill="#fef6e0" stroke="#a87b00" stroke-width="1.4"/>
  <text x="560" y="704" class="lbl" style="fill:#6a4d00;">Quality</text>
  <text x="560" y="720" class="sub" style="fill:#a87b00;">Linear → scalar</text>

  <!-- Comment head bypass arrow from Attention Pool -->
  <path d="M 490 416 Q 760 430 760 684" class="flow-soft" marker-end="url(#ar)"/>

  <rect x="680" y="684" width="162" height="48" rx="8" fill="#e3f0ff" stroke="#1f5fa6" stroke-width="1.4"/>
  <text x="761" y="704" class="lbl" style="fill:#0e3d70;">Comment</text>
  <text x="761" y="720" class="sub" style="fill:#1f5fa6;">Flan-T5 + prefix</text>

  <!-- Cls → Guidance lookup -->
  <line x1="239" y1="732" x2="239" y2="760" class="flow" marker-end="url(#ar)"/>
  <rect x="158" y="760" width="162" height="40" rx="8" fill="#f4f1e8" stroke="#5f5e5a" stroke-width="1"/>
  <text x="239" y="778" class="lbl">Guidance Lookup</text>
  <text x="239" y="793" class="sub">dict[class] → text</text>

  <!-- OUTPUT PILLS -->
  <line x1="239" y1="800" x2="239" y2="838" class="flow" marker-end="url(#ar)"/>
  <line x1="560" y1="732" x2="560" y2="838" class="flow" marker-end="url(#ar)"/>
  <line x1="761" y1="732" x2="761" y2="838" class="flow" marker-end="url(#ar)"/>

  <rect x="138" y="838" width="202" height="44" rx="10" fill="#fff" stroke="#0e3d70" stroke-width="1.8"/>
  <text x="239" y="865" class="out-lbl">guidance</text>

  <rect x="459" y="838" width="202" height="44" rx="10" fill="#fff" stroke="#0e3d70" stroke-width="1.8"/>
  <text x="560" y="865" class="out-lbl">quality score</text>

  <rect x="660" y="838" width="202" height="44" rx="10" fill="#fff" stroke="#0e3d70" stroke-width="1.8"/>
  <text x="761" y="865" class="out-lbl">comment</text>
</svg>
